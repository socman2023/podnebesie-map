name: Optimize Podnebesie map assets

on:
  workflow_dispatch:
  push:
    branches:
      - responsive-map-v2
    paths:
      - '.github/workflows/optimize-map.yml'
      - 'map-base.png'
      - 'tools/build_map_assets.py'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: responsive-map-v2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'

      - name: Build optimized raster images
        run: python tools/build_map_assets.py

      - name: Commit generated assets to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-preview.webp map-full.webp
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "Generate optimized overview and full-resolution map"
            git push origin HEAD:responsive-map-v2
          fi
