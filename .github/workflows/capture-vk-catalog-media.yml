name: Capture real VK map catalog screenshots

on:
  workflow_dispatch:
  push:
    branches: [vk-mini-app]
    paths: ['.github/workflows/capture-vk-catalog-media.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium
      - name: Capture genuine public UI
        run: |
          mkdir -p catalog-screenshots
          timeout 120s node - <<'NODE'
          const { chromium } = require('playwright');
          const base='https://socman2023.github.io/podnebesie-map/vk/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for(const [size,label] of [[390,'mobile'],[850,'desktop']]){
                const page=await browser.newPage({
                  viewport:{width:size,height:size===390?844:660},
                  deviceScaleFactor:2,isMobile:size===390,hasTouch:size===390
                });
                page.setDefaultTimeout(15000);
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                async function navigate(hash=''){
                  await page.goto(base+hash,{waitUntil:'domcontentloaded'});
                  await page.locator('#loading-state').waitFor({state:'hidden',timeout:30000});
                  await page.locator('.leaflet-image-layer').first().evaluate(async img=>{
                    if(img.complete && img.naturalWidth)return;
                    await Promise.race([
                      new Promise(resolve=>img.addEventListener('load',resolve,{once:true})),
                      new Promise((_,rej)=>setTimeout(()=>rej(Error('Basemap not loaded')),10000))
                    ]);
                  });
                  await page.waitForTimeout(800);
                }
                await navigate();
                await page.screenshot({path:'catalog-screenshots/'+label+'-01-map.png',animations:'disabled'});
                await navigate('#place=academia');
                await page.locator('#details-title').waitFor({state:'visible'});
                await page.screenshot({path:'catalog-screenshots/'+label+'-02-academy.png',animations:'disabled'});
                await page.locator('#details-close').click();
                await page.locator('#search-input').fill('Златоград');
                await page.locator('#search-results button').first().waitFor({state:'visible'});
                await page.screenshot({path:'catalog-screenshots/'+label+'-03-search.png',animations:'disabled'});
                await page.locator('#search-input').fill('');
                await page.locator('#list-toggle').click();
                await page.locator('#list-items button').first().waitFor({state:'visible'});
                await page.screenshot({path:'catalog-screenshots/'+label+'-04-list.png',animations:'disabled'});
                if(errors.length) throw Error(errors.join('\n'));
                console.log('CAPTURED',label,size);
                await page.close();
              }
            } finally{ await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podnebesie-real-vk-catalog-screenshots
          path: catalog-screenshots/
          if-no-files-found: error
          retention-days: 60
