name: Validate responsive Podnebesie map

on:
  workflow_dispatch:
  push:
    branches:
      - responsive-map-v2
    paths:
      - '.github/workflows/test-map.yml'
      - 'tests/**'
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'locations.json'
      - 'map-preview.webp'
      - 'map-full.webp'
  pull_request:
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'locations.json'

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout map
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium and test runner
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/podnebesie-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p screenshots
          npx playwright test --config=playwright.config.cjs

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podnebesie-responsive-qa
          path: |
            screenshots/
            playwright-report/
            test-results/
          if-no-files-found: ignore
