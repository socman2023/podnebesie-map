name: VK catalog desktop screenshots 1200x600
on:
  workflow_dispatch:
  push:
    branches: [vk-mini-app]
    paths: ['.github/workflows/capture-vk-desktop-1200x600.yml']
permissions:
  contents: read
jobs:
  desktop-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium
      - name: Capture exact 1200x600 from published app
        run: |
          mkdir -p desktop-vk-1200x600
          timeout 180s node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const base = 'https://socman2023.github.io/podnebesie-map/vk/';
          const out='desktop-vk-1200x600';
          const vkBridgeMock = [
            'window.vkBridge = {',
            '  isEmbedded: () => true,',
            '  subscribe: () => {},',
            '  send: () => Promise.resolve({result:true})',
            '};'
          ].join('\n');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({
                viewport:{width:1200,height:600},deviceScaleFactor:1,
                colorScheme:'light',reducedMotion:'reduce'
              });
              page.setDefaultTimeout(18000);
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.route('**/vendor/vk-bridge/browser.min.js', route =>
                route.fulfill({status:200,contentType:'application/javascript',body:vkBridgeMock}));
              async function open(hash=''){
                const response=await page.goto(base+hash,{waitUntil:'domcontentloaded',timeout:45000});
                if(!response || response.status()!==200)throw Error('HTTP navigation failure');
                await page.locator('#loading-state').waitFor({state:'hidden',timeout:30000});
                await page.locator('.leaflet-image-layer').first().evaluate(async img=>{
                  if(img.complete && img.naturalWidth>0)return;
                  await Promise.race([
                    new Promise((resolve,reject)=>{
                      img.addEventListener('load',resolve,{once:true});
                      img.addEventListener('error',()=>reject(Error('Map image error')),{once:true});
                    }),
                    new Promise((_,reject)=>setTimeout(()=>reject(Error('Image load timeout')),15000))
                  ]);
                });
                await page.waitForTimeout(900);
              }
              async function snap(name){
                const dest=out+'/'+name+'.png';
                await page.screenshot({path:dest,animations:'disabled',fullPage:false});
                const bytes=fs.readFileSync(dest);
                const w=bytes.readUInt32BE(16),h=bytes.readUInt32BE(20);
                if(w!==1200 || h!==600)throw Error(dest+' unexpected dimensions '+w+'x'+h);
                console.log('CAPTURED',dest,w+'x'+h,bytes.length+' bytes');
              }
              await open();
              await page.locator('#reset-view').click();
              await page.waitForTimeout(700);
              await snap('01-overview');

              await page.locator('#search-input').fill('Академия');
              await page.locator('#search-results button').first().waitFor({state:'visible'});
              await page.locator('#search-results button').first().click();
              await page.locator('#details-title').waitFor({state:'visible'});
              if((await page.locator('#details-title').innerText())!=='Академия')throw Error('Card incorrect');
              const cardImage=page.locator('#details-image');
              if(await cardImage.isVisible()){
                await cardImage.evaluate(async img=>{
                  if(img.complete)return;
                  await Promise.race([
                    new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});}),
                    new Promise(resolve=>setTimeout(resolve,6000))
                  ]);
                });
              }
              await page.locator('#search-input').fill('');
              await page.waitForTimeout(400);
              await snap('02-location-card');

              await page.locator('#details-close').click();
              await page.locator('#search-input').fill('Златоград');
              await page.locator('#search-results button').first().waitFor({state:'visible'});
              await snap('03-search');

              await page.locator('#search-input').fill('');
              await page.locator('#type-filter').selectOption('city');
              await page.locator('#list-toggle').click();
              await page.locator('#list-panel').waitFor({state:'visible'});
              await page.locator('#list-items button').first().waitFor({state:'visible'});
              await snap('04-locations-list');
              if(errors.length)throw Error('Browser errors: '+errors.join('; '));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: vk-desktop-screenshots-1200x600
          path: desktop-vk-1200x600/
          if-no-files-found: error
          retention-days: 90
