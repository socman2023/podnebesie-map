name: Smoke-test public responsive preview

on:
  workflow_dispatch:
  push:
    branches: [responsive-map-v2]
    paths: ['.github/workflows/check-preview-live.yml']

permissions:
  contents: read

jobs:
  live-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published root and preview assets
        run: |
          set -euo pipefail
          base="https://socman2023.github.io/podnebesie-map"
          for attempt in $(seq 1 18); do
            status=$(curl --max-time 15 -sSL -o /tmp/preview-check.html -w '%{http_code}' "$base/preview/index.html" || echo 000)
            if [ "$status" = 200 ] && grep -q 'Интерактивная карта Поднебесья' /tmp/preview-check.html; then
              echo "Live preview HTML verified on attempt $attempt"
              break
            fi
            echo "Waiting for Pages deployment (attempt $attempt, status $status)"
            sleep 12
          done
          test "$status" = 200
          grep -q 'vendor/leaflet/leaflet.js' /tmp/preview-check.html
          for file in locations.json script.js style.css vendor/leaflet/leaflet.css vendor/leaflet/leaflet.js map-preview.webp map-full.webp images/zlatograd.png; do
            result=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$base/preview/$file")
            test "$result" = 200 || { echo "Missing $file (HTTP $result)"; exit 1; }
            echo "OK preview/$file"
          done
          test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$base/")" = 200
          echo 'Production root remains online (HTTP 200)'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install mobile Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium
      - name: Check real public preview in browser
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport: {width:390, height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const errors=[];
            page.on('pageerror', e=>errors.push(e.message));
            const root='https://socman2023.github.io/podnebesie-map/preview/';
            const response = await page.goto(root,{waitUntil:'domcontentloaded',timeout:45000});
            if (response.status()!==200)throw Error('Preview HTML returned '+response.status());
            await page.locator('#loading-state').waitFor({state:'hidden',timeout:30000});
            await page.locator('#search-input').fill('Академия');
            await page.locator('#search-results button').first().click();
            await page.locator('#details-title').waitFor({state:'visible'});
            const text=await page.locator('#details-title').innerText();
            if(text!=='Академия')throw Error('Incorrect card '+text);
            const mapImageOk=await page.locator('.leaflet-image-layer').first().evaluate(async img => {
              if(!img.complete)await new Promise(resolve => {img.addEventListener('load',resolve,{once:true}); img.addEventListener('error',resolve,{once:true});});
              return img.naturalWidth>0;
            });
            if(!mapImageOk)throw Error('Map image did not load');
            if(errors.length)throw Error('Page errors: '+errors.join('; '));
            await page.screenshot({path:'/tmp/map-preview-live-390.png'});
            console.log('PUBLIC PREVIEW VERIFIED', {url:root,card:text,mapImageOk});
            await browser.close();
          })().catch(e=>{console.error(e); process.exitCode=1});
          NODE
