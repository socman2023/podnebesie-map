<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe7">
  <title>Интерактивная карта Поднебесья</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzxKBbJGVON3Kf6FwgdF1Zx/nM=" crossorigin="">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Поднебесье</h1>
        <span class="brand-subtitle">Интерактивная карта мира «Княжич»</span>
      </div>
      <form id="search-form" class="search" role="search" autocomplete="off">
        <label class="visually-hidden" for="search-input">Найти место или народ</label>
        <input id="search-input" type="search" placeholder="Поиск по карте…" enterkeyhint="search" spellcheck="false">
        <button type="submit" aria-label="Найти место" title="Найти место">Найти</button>
        <div id="search-results" class="search-results" aria-label="Результаты поиска" hidden></div>
      </form>
      <div class="toolbar-actions">
        <label class="visually-hidden" for="type-filter">Тип объекта</label>
        <select id="type-filter" title="Фильтр объектов">
          <option value="all">Все объекты</option>
          <option value="state">Государства</option>
          <option value="city">Города</option>
          <option value="tribe">Народы</option>
          <option value="place">Места</option>
          <option value="water">Реки и озёра</option>
          <option value="landmark">Достопримечательности</option>
          <option value="link">Ссылки</option>
        </select>
        <button id="list-toggle" type="button" aria-expanded="false" aria-controls="list-panel">Список</button>
        <button id="reset-view" type="button" title="Показать всю карту" aria-label="Показать всю карту">Вся карта</button>
      </div>
    </header>

    <main class="map-shell">
      <div id="map" role="region" aria-label="Карта Поднебесья. Используйте масштабирование и перемещение, либо поиск и список объектов."></div>
      <div id="loading-state" class="loading-state" role="status">Загружаем карту Поднебесья…</div>
      <div id="map-status" class="map-status" role="status" aria-live="polite"></div>

      <section id="list-panel" class="list-panel" aria-label="Список объектов карты" hidden>
        <div class="panel-heading">
          <h2>Места Поднебесья</h2>
          <button id="list-close" type="button" aria-label="Закрыть список">×</button>
        </div>
        <p class="panel-hint">Выберите место, чтобы перейти к нему на карте.</p>
        <div id="list-items" class="list-items"></div>
      </section>

      <aside id="details" class="details" aria-labelledby="details-title" hidden>
        <div class="details-header">
          <button id="details-back" type="button" class="details-back" hidden>← Назад</button>
          <button id="details-close" type="button" class="details-close" aria-label="Закрыть карточку">×</button>
        </div>
        <div class="details-scroll">
          <span id="details-type" class="details-type"></span>
          <h2 id="details-title" tabindex="-1"></h2>
          <img id="details-image" alt="" loading="lazy" decoding="async" hidden>
          <div id="details-description" class="details-description"></div>
          <nav id="details-links" class="details-links" aria-label="Связанные объекты"></nav>
        </div>
      </aside>
    </main>
  </div>
  <noscript><p>Для интерактивной карты необходимо включить JavaScript.</p></noscript>
</body>
</html>
